name: multi_llm_ai_agent
description: Cross-Platform Multi-LLM AI Agent App with Flutter, Supabase, and Edge Functions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  image_picker: ^1.1.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.4
  supabase_flutter: ^2.4.3
  go_router: ^14.2.0
  http: ^1.2.1
  dio: ^5.4.3+1
  google_mobile_ads: ^5.2.0
  flutter_markdown: ^7.0.1
  syntax_highlight: ^0.8.0
  highlight: ^0.8.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.1
  package_info_plus: ^8.0.1
  flutter_local_notifications: ^17.2.0
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.2

dev_dependencies:
  image_picker: ^1.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  injectable_generator: ^2.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
