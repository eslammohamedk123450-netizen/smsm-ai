name: Deploy ai-router to Supabase

on:
  push:
    branches: [release/v1]
    paths:
      - "supabase/functions/ai-router/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/deploy-supabase-ai-router.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ai-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ai-router Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: razvryvazmqvvqkzetuo
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy ai-router
        run: supabase functions deploy ai-router --project-ref "$SUPABASE_PROJECT_REF"
