name: Deploy Agent Edge Functions to Supabase

on:
  push:
    branches: [release/v1]
    paths:
      - "supabase/functions/ai-router/**"
      - "supabase/functions/composito-integration/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/deploy-supabase-ai-router.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ai-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Agent Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: razvryvazmqvvqkzetuo
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing. Add it as a GitHub Actions secret to enable automatic Supabase deployments from release/v1."
            exit 1
          fi
      - name: Deploy Agent Edge Functions
        run: supabase functions deploy ai-router composito-integration --project-ref "$SUPABASE_PROJECT_REF"
