name: Deploy Suly Production + Development Preview

on:
  push:
    branches: [release/v1, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable production source
        uses: actions/checkout@v4
        with:
          ref: release/v1
          path: production-source

      - name: Checkout development preview source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/apps/mobile/package-lock.json
            preview-source/apps/mobile/package-lock.json

      - name: Install production dependencies
        working-directory: production-source/apps/mobile
        run: npm ci --ignore-scripts

      - name: Export stable production web app
        working-directory: production-source/apps/mobile
        env:
          EXPO_PUBLIC_WEB_BASE_URL: /smsm-ai
          EXPO_PUBLIC_SUPABASE_URL: https://razvryvazmqvvqkzetuo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_t5xrzZNN6Uj9zhhBLUYQVg_mj7qPjQL
          EXPO_PUBLIC_EDGE_FUNCTION_BASE_URL: https://razvryvazmqvvqkzetuo.supabase.co/functions/v1
        run: npx expo export --platform web --clear

      - name: Install development dependencies
        working-directory: preview-source/apps/mobile
        run: npm ci --ignore-scripts

      - name: Export development preview
        working-directory: preview-source/apps/mobile
        env:
          EXPO_PUBLIC_WEB_BASE_URL: /smsm-ai/preview
          EXPO_PUBLIC_SUPABASE_URL: https://razvryvazmqvvqkzetuo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_t5xrzZNN6Uj9zhhBLUYQVg_mj7qPjQL
          EXPO_PUBLIC_EDGE_FUNCTION_BASE_URL: https://razvryvazmqvvqkzetuo.supabase.co/functions/v1
        run: npx expo export --platform web --clear

      - name: Assemble production and preview site
        run: |
          mkdir -p site/preview
          cp -R production-source/apps/mobile/dist/. site/
          cp -R preview-source/apps/mobile/dist/. site/preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy combined production and preview site
        id: deployment
        uses: actions/deploy-pages@v4
