name: Deploy SULY Production

on:
  push:
    branches: [release/v1]
  pull_request:
    branches: [release/v1]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/release/v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install production dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Type-check production app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run production test suite
        working-directory: apps/mobile
        run: npm test -- --runInBand

      - name: Export production web app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_WEB_BASE_URL: ""
          EXPO_PUBLIC_SUPABASE_URL: https://razvryvazmqvvqkzetuo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_t5xrzZNN6Uj9zhhBLUYQVg_mj7qPjQL
          EXPO_PUBLIC_EDGE_FUNCTION_BASE_URL: https://razvryvazmqvvqkzetuo.supabase.co/functions/v1
        run: npx expo export --platform web --clear

      - name: Assemble single production site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R apps/mobile/dist/. site/

      - name: Verify production export
        run: |
          set -euo pipefail
          test -f site/index.html
          test -n "$(find site/_expo/static/js/web -maxdepth 1 -type f -name 'media-catalog-*.js' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          site = Path("site")
          html = (site / "index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
          if not scripts:
              raise SystemExit("No JavaScript bundles found in production index.html")
          for url in scripts:
              if not url.startswith("/_expo/static/js/web/"):
                  raise SystemExit(f"Unexpected production bundle URL: {url}")
              if not (site / url.lstrip("/")).is_file():
                  raise SystemExit(f"Missing JavaScript bundle: {url}")
          if (site / "preview").exists():
              raise SystemExit("Preview content must not be deployed")
          print(f"Verified single production export with {len(scripts)} JavaScript bundles.")
          PY

      - name: Archive production assets for stale-client recovery
        uses: actions/upload-artifact@v4
        with:
          name: suly-web-assets-${{ github.run_id }}
          path: site/_expo/
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy SULY production site
        id: deployment
        uses: actions/deploy-pages@v4
