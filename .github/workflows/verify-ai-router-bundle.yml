name: Verify Edge Function deployment artifacts

on:
  pull_request:
    paths:
      - "supabase/functions/ai-router/**"
      - "supabase/functions/sync-models/**"
      - "supabase/functions/image-generator/**"
      - "apps/mobile/src/features/admin/MediaGenerationModelsAdminScreen.tsx"
      - "supabase/migrations/**"
      - "supabase/deploy-artifacts/ai-router.bundle.js"
      - "supabase/deploy-artifacts/sync-models.bundle.js"
      - "package.json"
      - ".github/workflows/verify-ai-router-bundle.yml"
  push:
    branches: [release/v1, feat/agent-worker-brain-queue]
    paths:
      - "supabase/functions/ai-router/**"
      - "supabase/functions/sync-models/**"
      - "supabase/functions/image-generator/**"
      - "apps/mobile/src/features/admin/MediaGenerationModelsAdminScreen.tsx"
      - "supabase/migrations/**"
      - "supabase/deploy-artifacts/ai-router.bundle.js"
      - "supabase/deploy-artifacts/sync-models.bundle.js"
      - "package.json"
      - ".github/workflows/verify-ai-router-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-bundle:
    name: Build and verify Edge Function bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch (or release branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the deployment bundle
        run: npm run bundle:ai-router && npm run bundle:sync-models

      - name: Commit the regenerated bundle to the development branch
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref_name == 'feat/agent-worker-brain-queue')
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ -z "$(git status --porcelain supabase/deploy-artifacts/ai-router.bundle.js supabase/deploy-artifacts/sync-models.bundle.js)" ]; then
            echo "The committed Edge Function bundles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/deploy-artifacts/ai-router.bundle.js supabase/deploy-artifacts/sync-models.bundle.js
          git commit -m "chore(ai-router): regenerate deployment bundle"
          git fetch origin "$TARGET_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
            echo "The branch advanced during bundle generation; a newer run will rebuild against the latest source."
            exit 0
          fi
          git push origin "HEAD:$TARGET_REF"

      - name: Fail when the artifact is stale and cannot be updated
        run: |
          if [ -n "$(git status --porcelain supabase/deploy-artifacts/ai-router.bundle.js supabase/deploy-artifacts/sync-models.bundle.js)" ]; then
            echo "An Edge Function bundle is stale. Regenerate with 'npm run bundle:ai-router && npm run bundle:sync-models'."
            exit 1
          fi
          echo "Edge Function bundles match the current source."

  media-billing:
    name: Currency-safe media billing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test currency-safe billing and endpoint validation
        run: deno test supabase/functions/image-generator/cost.test.ts
      - name: Type-check image generator
        run: deno check supabase/functions/image-generator/index.ts
