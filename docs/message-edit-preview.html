<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Suly message edit preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,"Segoe UI",sans-serif}.screen{width:900px;min-height:1100px;margin:0 auto;padding:54px 120px;background:linear-gradient(180deg,#090909,#111827)}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263244;padding:0 0 18px;margin-bottom:50px}.brand{font-size:26px;font-weight:800;color:#22a9e8}.title{color:#94a3b8;font-size:16px}.bubble{border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #0006}.user{background:#fff;color:#111827;width:76%;margin-right:auto}.assistant{background:#111827;border:1px solid #273449;width:100%;margin-left:auto}.label{font-size:13px;color:#64748b;margin-bottom:10px}.user p,.assistant p{font-size:22px;line-height:1.7;margin:0;text-align:right}.assistant h3{font-size:18px;margin:0 0 16px;color:#e2e8f0}.assistant p{font-size:20px;color:#f8fafc}.actions{display:flex;gap:18px;align-items:center;color:#64748b;font-size:14px;margin-top:12px}.editbox{background:#fff;color:#111827;border-radius:18px;padding:20px;width:76%;margin-right:auto}.editbox textarea{display:block;width:100%;height:110px;border:1px solid #cbd5e1;border-radius:12px;padding:14px;font-size:20px;text-align:right;resize:none}.buttons{display:flex;gap:10px;margin-top:12px}.save,.cancel{border:0;border-radius:9px;padding:11px 25px;font-size:16px;font-weight:700}.save{background:#2563eb;color:#fff}.cancel{background:#e5e7eb;color:#374151}.nav{display:flex;align-items:center;gap:12px;color:#cbd5e1;font-size:16px;margin:-6px 0 16px}.arrow{background:#1f2937;border:0;color:#fff;border-radius:7px;width:34px;height:30px;font-size:20px}.muted{color:#64748b;font-size:13px}.pill{color:#64748b;font-size:13px;margin-right:10px}
</style></head><body><main class="screen"><header class="top"><div class="brand">Suly</div><div class="title">محادثة آمنة ومرتبة</div></header><section id="content"></section></main><script>
const s=(html)=>document.getElementById('content').innerHTML=html;
const user=(text,extra='')=>`<div class="bubble user"><div class="label">أنت ${extra}</div><p>${text}</p><div class="actions">نسخ　 ✎ تعديل</div></div>`;
const answer=(text,nav='')=>`${nav}<div class="bubble assistant"><h3>Suly</h3><p>${text}</p><div class="actions">نسخ　 ♡　 لا يعجبني</div></div>`;
const states={before:()=>s(user('إزاي أعمل ملخص للملف؟')+answer('أرسل الملف هنا، وسألخصه لك في نقاط واضحة مع الحفاظ على أهم التفاصيل.')),editing:()=>s(`<div class="editbox"><div class="label">تعديل الرسالة</div><textarea>إزاي أعمل ملخص للملف مع أهم النقاط؟</textarea><div class="buttons"><button class="save">حفظ</button><button class="cancel">إلغاء</button></div></div>`+answer('أرسل الملف هنا، وسألخصه لك في نقاط واضحة مع الحفاظ على أهم التفاصيل.')),after:()=>s(user('إزاي أعمل ملخص للملف مع أهم النقاط؟','<span class="pill">تم التعديل</span>')+answer('هل تريد ملخصًا مختصرًا أم ملخصًا تفصيليًا؟',`<div class="nav"><button class="arrow">&gt;</button><b>2 / 2</b><button class="arrow">&lt;</button><span class="muted">نسخ الرد</span></div>`))};
states[location.hash.slice(1)||'after']?.();
</script></body></html>
